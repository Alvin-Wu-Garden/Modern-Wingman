syntax = "proto3";

option csharp_namespace = "AgentService.Host.GrpcServices";

package runs;

// ─── Run 服務 ─────────────────────────────────────────────────────────────────

service RunService {
  // 建立並啟動一個新的 Run（非同步執行，立刻回傳 runId）
  rpc CreateRun (CreateRunRequest) returns (CreateRunResponse);

  // 取消進行中的 Run
  rpc CancelRun (CancelRunRequest) returns (CancelRunResponse);

  // 取得 Run 狀態快照（polling fallback）
  rpc GetRun (GetRunRequest) returns (GetRunResponse);

  // server-side streaming：Run 的完整事件流
  // 呼叫者應在 CreateRun 後立刻訂閱此 stream
  rpc StreamRunEvents (StreamRunEventsRequest) returns (stream RunEvent);
}

// ─── Request / Response 訊息 ─────────────────────────────────────────────────

message CreateRunRequest {
  string session_id     = 1;
  string user_message   = 2;
  // null / empty = 使用 appsettings 的 ActiveProfileId
  string provider_profile_id = 3;
  // 工作區根目錄絕對路徑
  string workspace_path = 4;
  string project_id = 5;
  // "ask" | "plan" | "auto" | "full_auto"; empty defaults to "plan"
  string agent_mode = 6;
  // "direct" | "git_worktree" | "svn_shadow_git" | "snapshot"
  string workspace_strategy = 7;
}

message CreateRunResponse {
  string run_id = 1;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  bool success = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  string run_id   = 1;
  string status   = 2;  // "created" | "running" | "completed" | "failed" | "cancelled"
  string error    = 3;
  string created_at = 4;
  string started_at = 5;
  string ended_at   = 6;
  string agent_mode = 7;
  string workspace_strategy = 8;
  string project_id = 9;
}

message StreamRunEventsRequest {
  string run_id = 1;
}

// 單一串流事件；payload_json 依 event_type 定義不同欄位
message RunEvent {
  string run_id       = 1;
  string event_type   = 2;  // "run:started" | "run:token" | "run:tool-call" | ...
  string timestamp    = 3;  // ISO-8601
  string payload_json = 4;  // 事件專屬 JSON 資料
}
