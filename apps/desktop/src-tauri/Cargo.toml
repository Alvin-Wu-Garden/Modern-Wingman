[package]
name = "modern-wingman-desktop"
version = "0.1.0"
description = "Modern Wingman Desktop Application"
authors = ["Modern Wingman Team"]
edition = "2021"
default-run = "modern-wingman-desktop"

[lib]
name = "modern_wingman_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "modern-wingman-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
