[package]
name = "modern-wingman-desktop"
version = "0.1.0"
description = "Modern Wingman Desktop Application"
authors = ["Modern Wingman Team"]
edition = "2021"
default-run = "modern-wingman-desktop"

[lib]
name = "modern_wingman_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "modern-wingman-desktop"
path = "src/main.rs"

[[bin]]
name = "wingman-cli"
path = "src/bin/wingman_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Skills library — local SQLite cache + GitHub API client
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
# Central library — zip import, recursive dir walk, Windows junction links
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
junction = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
